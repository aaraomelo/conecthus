services:
  postgres:
    image: postgres:16-alpine
    container_name: conecthus-postgres
    environment:
      POSTGRES_USER: conecthus
      POSTGRES_PASSWORD: conecthus
      POSTGRES_DB: conecthus
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conecthus -d conecthus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: conecthus-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2.0.18
    container_name: conecthus-mqtt
    ports:
      - "1883:1883"
      - "8083:8083"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 > /dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: conecthus-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://conecthus:conecthus@postgres:5432/conecthus?schema=public"
      REDIS_URL: "redis://redis:6379"
      MQTT_URL: "mqtt://mqtt:1883"
      JWT_SECRET: "change-me-in-production"
      JWT_EXPIRES_IN: "7d"
      BCRYPT_SALT_ROUNDS: "10"
    ports:
      - "127.0.0.1:3005:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/docs >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./web
    container_name: conecthus-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: